spring.application.name=video-game-db

spring.config.import=optional:file:.env[.properties]

spring.jpa.hibernate.ddl-auto=validate

spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Caffeine is on the classpath for the Twitch token L1 cache, which does not use Spring Cache.
# Without an explicit type, Boot may pick CaffeineCacheManager over Redis.
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Connect fast so an unreachable Redis becomes a cache miss quickly. The command timeout is
# looser: a slow reply should not be turned into a miss, which would re-call IGDB.
spring.data.redis.connect-timeout=200ms
spring.data.redis.timeout=1s

igdb.client-id=${TWITCH_CLIENT_ID}
igdb.client-secret=${TWITCH_CLIENT_SECRET}
igdb.twitch-token-uri=https://id.twitch.tv/oauth2/token
igdb.token-refresh-buffer=60s
igdb.requests-per-second=4
igdb.max-concurrent=8
igdb.throttle-timeout=5s

spring.http.serviceclient.igdb.base-url=https://api.igdb.com/v4

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-ttl=15m
app.jwt.issuer=video-game-db
